# Render Blueprint — un solo servicio: FastAPI sirve la API y el build del front (Vue).
services:
  - type: web
    name: cepremix
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      npm --prefix frontend install
      npm --prefix frontend run build
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: STREAMING_MODE
        value: direct
      # YouTube bloquea la extracción desde IPs de datacenter (Render): /audio falla
      # siempre con 429/502. "off" hace que falle al instante y el cliente use el iframe
      # sin esperar ~20 s. Ponlo en "on" si algún día usas un proxy residencial.
      - key: AUDIO_PROXY
        value: "off"
      # Configura tu propia clave en el dashboard de Render (no la subas al repo).
      - key: YOUTUBE_API_KEY
        sync: false
